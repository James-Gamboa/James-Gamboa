<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </linearGradient>
  
</defs>
<style>
  text{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace}
  .f{opacity:0;animation:fade .7s ease forwards}
  .blink{animation:blink 1s steps(1) infinite}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .float{animation:float 6s ease-in-out infinite}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes blink{50%{opacity:0}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){.f,.blink,.pulse,.float{animation:none;opacity:1}}
</style>
<text x="12" y="40" font-size="18" fill="#4ade80">➜</text><text x="36" y="40" font-size="18" fill="#22d3ee">~</text>
<clipPath id="t7"><rect x="58" y="18" width="0" height="30">
  <animate attributeName="width" values="0;11;22;32;43;54;65;76;86;97;108;119;130;153" calcMode="discrete" begin="0.3s" dur="0.59s" fill="freeze"/>
</rect></clipPath>
<text x="60" y="40" font-size="18" font-weight="400" fill="#e6edf3" clip-path="url(#t7)">git remote -v</text>
